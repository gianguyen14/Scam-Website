<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ScamGuard AI</title>
    <style>
        body { width: 320px; padding: 12px; font-family: -apple-system, sans-serif; }
        #url-container { font-size: 12px; color: #555; word-wrap: break-word; margin-bottom: 12px; }
        .safe { color: #10b981; font-weight: bold; }

    </style>
</head>
<body>
    <h3 style="margin-top:0;">ScamGuard AI</h3>
    <div id="url-container">Loading...</div>

    </div>

</html>
